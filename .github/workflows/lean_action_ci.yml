name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Generous headroom for a cache-miss run: `or-tools/build` isn't
    # committed (or-tools/.gitignore excludes it), so building it from
    # scratch with -DBUILD_DEPS=ON compiles abseil/protobuf/re2/CBC/SCIP/
    # HiGHS/OR-Tools itself, which can take well over an hour.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      - name: Compute OR-Tools source hash
        id: or-tools-hash
        run: echo "hash=$(git rev-parse HEAD:or-tools)" >> "$GITHUB_OUTPUT"

      - name: Cache OR-Tools build
        uses: actions/cache@v6
        with:
          path: or-tools/build
          key: or-tools-build-${{ runner.os }}-${{ steps.or-tools-hash.outputs.hash }}

      - uses: leanprover/lean-action@v1
        env:
          # Bare `-j` (cmake's own heuristic) can overcommit memory on a
          # shared CI runner; pin it down explicitly here.
          LEANCPSAT_ORTOOLS_JOBS: 4

      # Temporary: dumps the exact failing link command, a verbose re-run
      # showing the actual ld invocation with a file-open trace, and scans
      # every shared library referenced for embedded GNU ld GROUP()/INPUT()
      # linker scripts (a `-lgcc` never appears as a literal flag on the
      # command line, so it must come from inside one of these). Remove once
      # the streaming-solve link issue is resolved.
      - name: Debug link failure
        if: failure()
        run: |
          set +e
          RSP=.lake/build/bin/test.rsp
          if [ -f "$RSP" ]; then
            echo "=== $RSP ($(wc -l < "$RSP") args) ==="
            cat "$RSP"
          else
            echo "=== $RSP not found ==="
          fi
          CLANG=$(find "$HOME/.elan" -type f -name clang -path "*bin*" 2>/dev/null | head -1)
          echo "=== clang: $CLANG ==="
          if [ -n "$CLANG" ] && [ -f "$RSP" ]; then
            echo "=== verbose relink (with ld file-open trace) ==="
            "$CLANG" -v -Wl,-t -o /tmp/test_debug @"$RSP" 2>&1 | tail -400
          fi
          echo "=== scanning linked .so files for embedded linker scripts (non-ELF) ==="
          for dir in /usr/lib/gcc/x86_64-linux-gnu/*/../../../x86_64-linux-gnu \
                     /usr/lib/x86_64-linux-gnu /lib/x86_64-linux-gnu \
                     "$HOME"/.elan/toolchains/*/lib "$HOME"/.elan/toolchains/*/lib/glibc \
                     "${GITHUB_WORKSPACE}"/or-tools/build/lib; do
            [ -d "$dir" ] || continue
            for f in "$dir"/lib*.so*; do
              [ -f "$f" ] || continue
              if ! head -c 4 "$f" | cmp -s - <(printf '\177ELF'); then
                echo "--- non-ELF (likely linker script): $f ---"
                head -c 500 "$f"
                echo
              fi
            done
          done
